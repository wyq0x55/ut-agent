      - name: Build Clang extractor
        shell: pwsh
        run: |
          $llvm = $env:UT_AGENT_LLVM
          if (-not $llvm) {
            throw "UT_AGENT_LLVM was not exported by the LLVM installation step"
          }
          cmake -S tooling -B build `
            "-DLLVM_DIR=$llvm/lib/cmake/llvm" `
            "-DClang_DIR=$llvm/lib/cmake/clang"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed with exit code $LASTEXITCODE"
          }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) {
            throw "CMake build failed with exit code $LASTEXITCODE"
          }
          $extractor = Get-ChildItem -Path build -Filter ut-clang-extract.exe -Recurse -File |
            Select-Object -First 1
          if (-not $extractor) {
            throw "CMake build did not produce ut-clang-extract.exe"
          }
          New-Item -ItemType Directory -Force -Path .build/ut-clang-extract-nmake2/bin | Out-Null
          Copy-Item -LiteralPath $extractor.FullName -Destination .build/ut-clang-extract-nmake2/bin/ut-clang-extract.exe -Force
      - name: Run extractor fixtures
        shell: pwsh
