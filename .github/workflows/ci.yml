name: CI

on:
  push:
  pull_request:

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.11 --extra dev --locked
      - run: uv run python -m pytest tests/test_issue3_architecture.py tests/test_ir_json.py

  clang-fixtures:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --yes
      - name: Install Python package
        shell: pwsh
        run: uv sync --python 3.11 --extra dev --locked
      - name: Build Clang extractor
        shell: pwsh
        run: |
          $llvm = "C:/Program Files/LLVM"
          cmake -S tooling -B build `
            "-DLLVM_DIR=$llvm/lib/cmake/llvm" `
            "-DClang_DIR=$llvm/lib/cmake/clang"
          cmake --build build --config Release
          New-Item -ItemType Directory -Force -Path .build/ut-clang-extract-nmake2/bin | Out-Null
          if (Test-Path build/bin/Release/ut-clang-extract.exe) {
            Copy-Item build/bin/Release/ut-clang-extract.exe .build/ut-clang-extract-nmake2/bin/ut-clang-extract.exe
          } else {
            Copy-Item build/bin/ut-clang-extract.exe .build/ut-clang-extract-nmake2/bin/ut-clang-extract.exe
          }
      - name: Run extractor fixtures
        shell: pwsh
        run: uv run python -m pytest tests/test_clang_extractor.py tests/test_ir_json.py
